name: Release

# Tag pushed → typecheck, test, build, pack a tarball, publish to npm, then
# create the GitHub Release with the notes from docs/releases/<tag>.md
# (generated notes as a fallback).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify published contents
        run: npx --yes publint

      - name: Pack tarball
        run: npm pack

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} 已存在，跳过发布"
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Locate release notes
        id: notes
        run: |
          file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          files: '*.tgz'
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
