name: Release

# Tag pushed → typecheck, test, build, pack a tarball, then create the GitHub
# Release with the notes from docs/releases/<tag>.md (generated notes as a
# fallback). The project is distributed via GitHub, so nothing goes to npm.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify published contents
        run: npx --yes publint

      - name: Pack tarball
        run: npm pack

      - name: Locate release notes
        id: notes
        run: |
          file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          files: '*.tgz'
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # Publishing to npm is intentionally disabled. To enable it, register the
      # package, then either bind a Trusted Publisher on npmjs.com or add an
      # NPM_TOKEN secret (Automation type) and uncomment the step below.
      #
      # - name: Publish
      #   run: npm publish --provenance
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
